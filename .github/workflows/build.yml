
name: Build Monster Hopper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MonsterHopperAndroid.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip MonsterHopperAndroid.zip -d source

      - name: Build debug APK
        working-directory: source/MonsterHopperAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MonsterHopper-APK
          path: source/MonsterHopperAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
